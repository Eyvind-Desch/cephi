[package]
name = "cephi"
version = "0.2.0"
description = "Always-available desktop assistant for Windows, powered by local Ollama models"
authors = ["Eyvind"]
edition = "2021"
publish = false

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "cephi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-log = "2.9.1"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.4"

# Async / IO
futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["macros", "process", "sync", "time"] }
tokio-util = "0.7.19"
# Windows-native TLS (schannel) instead of aws-lc-rs: no CMake/NASM needed to build.
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "form", "http2", "json", "native-tls", "query", "stream", "system-proxy"] }

# Serialization / errors / logging
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2.0.20"
log = "0.4.34"

# Utilities
arboard = { version = "3.6.1", default-features = false }
chrono = "0.4.45"
notify-debouncer-mini = "0.7.0"
regex = "1.13.1"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

# Windows APIs: Credential Manager (secrets), media keys
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security_Credentials", "Win32_System_DataExchange", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61", features = ["Devices_Radios", "Foundation_Collections", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "std"] }
rust-i18n = "4.2.2"
# MCP client: tools from external servers (local processes or HTTP).
rmcp = { version = "3.4", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-native-tls", "which-command"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
