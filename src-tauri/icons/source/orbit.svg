<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon: the Orbit mark (planet + satellite) on a dark tile, readable on light and dark taskbars.
       Regenerate all sizes with: npx tauri icon src-tauri/icons/source/orbit.svg -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23232b" />
      <stop offset="100%" stop-color="#15151a" />
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b6bff" />
      <stop offset="100%" stop-color="#21c7e6" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6b5cff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6b5cff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#tile)" />
  <circle cx="512" cy="512" r="330" fill="url(#glow)" />
  <circle cx="512" cy="512" r="330" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="40" />
  <circle cx="512" cy="512" r="185" fill="url(#core)" />
  <!-- Satellite on the orbit, upper right (45°). -->
  <circle cx="745" cy="279" r="68" fill="#21c7e6" stroke="#1a1a20" stroke-width="22" />
</svg>
